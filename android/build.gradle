// Known-good toolchain for this project (Chaquopy + Compose + JDK 17).
// NOTE: do NOT let Android Studio's AGP Upgrade Assistant push this to AGP 9 —
// AGP 9 removes packagingOptions/kotlinOptions and needs compileSdk 36, which
// breaks this build. Decline the upgrade prompt.
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    // Chaquopy 17 links its native libs (CPython stdlib) in 16 KB page mode
    id 'com.chaquo.python' version '17.0.0' apply false
}

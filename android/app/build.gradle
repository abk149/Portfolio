plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.portfolio.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.portfolio.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "requests"
            install "pandas"
            install "numpy"
            // install "scipy" (Currently failing in Chaquopy 3.11/arm64-v8a)
            install "python-dotenv"
            install "typer"
            install "rich"
            install "jinja2"
            install "tabulate"
            install "openpyxl"
            install "xlsxwriter"
            install "fastapi==0.99.1"
            install "pydantic==1.10.13"
            install "uvicorn"
            install "beautifulsoup4"
            install "lxml"
            install "pypdf"
            install "ebooklib"
            install "python-multipart"
            install "APScheduler"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
}

// Gradle task to synchronize the latest Python files from the parent directory
tasks.register('syncPythonSource') {
    group = 'quant'
    description = 'Syncs latest Python source from workspace to Android project'
    doLast {
        def pythonSrcDir = file("${projectDir}/src/main/python")
        if (pythonSrcDir.exists()) {
            pythonSrcDir.deleteDir()
        }
        pythonSrcDir.mkdirs()
        
        copy {
            from "../../src"
            into "${pythonSrcDir}/src"
        }
        copy {
            from "../../config"
            into "${pythonSrcDir}/config"
        }
        copy {
            from "../../main.py"
            into "${pythonSrcDir}"
        }
        if (file("../../.env").exists()) {
            copy {
                from "../../.env"
                into "${pythonSrcDir}"
            }
        }
    }
}

preBuild.dependsOn syncPythonSource

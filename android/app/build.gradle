plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.portfolio.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.portfolio.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
        // Keep native libs uncompressed + page-aligned in the APK (16 KB ready)
        jniLibs {
            useLegacyPackaging false
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install "requests"
            install "pandas"
            install "numpy"
            // install "scipy" (Currently failing in Chaquopy 3.11/arm64-v8a)
            install "python-dotenv"
            install "typer"
            install "rich"
            install "jinja2"
            install "tabulate"
            install "openpyxl"
            install "xlsxwriter"
            install "fastapi==0.99.1"
            install "pydantic==1.10.13"
            install "uvicorn"
            install "beautifulsoup4"
            install "lxml"
            install "pypdf"
            install "ebooklib"
            install "python-multipart"
            install "APScheduler"
            install "pyotp"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'

    // ── Jetpack Compose (native UI) ──
    def composeBom = platform('androidx.compose:compose-bom:2024.05.00')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Networking to the on-device FastAPI backend (127.0.0.1:8000)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

// Gradle task to synchronize the latest Python files from the parent directory
tasks.register('syncPythonSource') {
    group = 'quant'
    description = 'Syncs latest Python source from workspace to Android project'
    doLast {
        def pythonSrcDir = file("${projectDir}/src/main/python")
        if (pythonSrcDir.exists()) {
            pythonSrcDir.deleteDir()
        }
        pythonSrcDir.mkdirs()
        
        copy {
            from "../../src"
            into "${pythonSrcDir}/src"
        }
        copy {
            from "../../config"
            into "${pythonSrcDir}/config"
        }
        copy {
            from "../../main.py"
            into "${pythonSrcDir}"
        }
        if (file("../../.env").exists()) {
            copy {
                from "../../.env"
                into "${pythonSrcDir}"
            }
        }
    }
}

preBuild.dependsOn syncPythonSource
